## 리뷰 축과 산출 파일

4개 축을 **전부** 실행함. 축을 임의로 생략하지 않음.

| 축 | 수행 주체 | 산출 파일 |
| --- | --- | --- |
| 아키텍처 | `architecture-reviewer` | `{reviewsDir}/architecture.md` |
